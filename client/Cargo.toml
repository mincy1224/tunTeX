[package]
name = "tuntex-client"
version = "1.0.0"
edition = "2021"
description = "Transparent local-to-remote LaTeX compiler proxy"
license = "MIT"
publish = false

[lib]
name = "tuntex_client"
path = "src/lib.rs"

[[bin]]
name = "tuntex-client"
path = "src/main.rs"

[dependencies]
# Blocking HTTP only: no async runtime, so the binary stays a single exe with no
# extra runtime dependencies.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
ctrlc = "3"
sha2 = "0.10"

