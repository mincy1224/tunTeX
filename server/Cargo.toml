[package]
name = "tuntex-server"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "tuntex-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

